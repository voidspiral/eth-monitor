schema: spec-driven

context: |
  Standalone HPC host ethernet monitor (this repo), not ClusterHelm, not
  mpi-monitor, and not a packet sniffer. Samples ethernet NIC rx/tx rates into
  host-level JSONL. Optional --match samples per-PID live TCP rates via
  sock_diag byte deltas (not UDP/IB, not pcap). Tech stack: Python 3.10+,
  stdlib first; matplotlib optional for PNG plots.
  TDD: write failing tests before implementation (unittest).
  design.md body stays English. Propose-stage replies include a Chinese
  translation of design.md.
  No hardcoded user home paths. Config and CLI flags only.
  Compute nodes may lack a deployed copy of this package; remote sampling
  uses an inline payload over SSH.
  Neighbor repos for context only: mpi-monitor (process CPU/RSS/IO collect
  contract) and agent-sidecar (orchestrator that will later import
  collect_loop). Do not copy ClusterHelm control-plane code.

rules:
  proposal:
    - Always include a "Non-goals" section
    - Explicitly exclude ClusterHelm control-plane integration
  design:
    - Keep the design.md body in English
    - Record TDD as the implementation method
  tasks:
    - Order work as failing tests first, then implementation
    - Break tasks into chunks of max 2 hours
